name: Update OSINT Feed

on:
  schedule:
    - cron: '0 0 * * *'  # Once daily at midnight UTC
  workflow_dispatch:  # Lets you manually trigger it anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update_feed.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%d-%H:%M)"
          git push
